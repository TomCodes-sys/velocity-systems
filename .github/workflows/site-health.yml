name: Site health

on:
  push:
    branches: [main, feature/site-tools-polish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate current static pages
        run: node scripts/build.js
      - name: Commit regenerated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate static pages [skip ci]"
            git push
          fi
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check syntax, references, runtime errors and layout
        run: node scripts/site-health-check.js
        env:
          VS_HEALTH_BROWSER: '1'
